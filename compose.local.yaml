name: maap-local

x-api-environment: &api-environment
  MAAP_DATABASE_URL: >-
    postgresql+asyncpg://${MAAP_POSTGRES_USER:-maap}:${MAAP_POSTGRES_PASSWORD:?Set MAAP_POSTGRES_PASSWORD in .env.compose}@postgres:5432/${MAAP_POSTGRES_DB:-maap}
  MAAP_ENVIRONMENT: ${MAAP_RUNTIME_ENVIRONMENT:-development}
  MAAP_OLLAMA_BASE_URL: http://host.docker.internal:11434
  MAAP_OLLAMA_EMBEDDING_MODEL: qwen3-embedding:0.6b
  MAAP_EMBEDDING_DIMENSION: "1024"

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MAAP_POSTGRES_USER:-maap}
      POSTGRES_PASSWORD: ${MAAP_POSTGRES_PASSWORD:?Set MAAP_POSTGRES_PASSWORD in .env.compose}
      POSTGRES_DB: ${MAAP_POSTGRES_DB:-maap}
    ports:
      - "127.0.0.1:${MAAP_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb
    networks:
      - backend

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      [
        "python",
        "-m",
        "alembic",
        "-c",
        "backend/alembic.ini",
        "upgrade",
        "head",
      ]
    restart: "no"
    env_file:
      - path: ./backend/.env
        required: false
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - path: ./backend/.env
        required: false
    environment: *api-environment
    ports:
      - "127.0.0.1:${MAAP_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - edge

volumes:
  postgres_data:

networks:
  backend:
    internal: true
  edge:
