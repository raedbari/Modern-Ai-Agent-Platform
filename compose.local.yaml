name: maap-local

x-api-environment: &api-environment
  MAAP_DATABASE_URL: >-
    postgresql+asyncpg://${MAAP_POSTGRES_USER:-maap}:${MAAP_POSTGRES_PASSWORD:?Set MAAP_POSTGRES_PASSWORD in .env.compose}@postgres:5432/${MAAP_POSTGRES_DB:-maap}
  MAAP_ENVIRONMENT: ${MAAP_RUNTIME_ENVIRONMENT:-development}
  MAAP_OLLAMA_BASE_URL: http://host.docker.internal:11434
  MAAP_OLLAMA_EMBEDDING_MODEL: qwen3-embedding:0.6b
  MAAP_EMBEDDING_DIMENSION: "1024"
  MAAP_OLLAMA_EMBEDDING_NUM_CTX: "1024"
  MAAP_OLLAMA_EMBEDDING_NUM_BATCH: "64"
  MAAP_OLLAMA_EMBEDDING_KEEP_ALIVE: 10m
  MAAP_OLLAMA_EMBEDDING_MAX_RETRIES: "2"
  MAAP_OLLAMA_EMBEDDING_RETRY_BASE_SECONDS: "0.5"
  MAAP_EMBEDDING_BATCH_SIZE: "8"

  MAAP_VOYAGE_API_KEY: ${MAAP_VOYAGE_API_KEY:?Set MAAP_VOYAGE_API_KEY in .env.compose}
  MAAP_VOYAGE_MODEL: voyage-4-large
  MAAP_VOYAGE_RERANK_MODEL: rerank-2.5
  MAAP_RETRIEVAL_CANDIDATE_COUNT: "20"

  MAAP_UPLOAD_STORAGE_ROOT: /var/lib/maap/uploads
  MAAP_REDIS_URL: redis://redis:6379/0

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MAAP_POSTGRES_USER:-maap}
      POSTGRES_PASSWORD: ${MAAP_POSTGRES_PASSWORD:?Set MAAP_POSTGRES_PASSWORD in .env.compose}
      POSTGRES_DB: ${MAAP_POSTGRES_DB:-maap}
    ports:
      - "127.0.0.1:${MAAP_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb
    networks:
      - backend

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      [
        "python",
        "-m",
        "alembic",
        "-c",
        "backend/alembic.ini",
        "upgrade",
        "head",
      ]
    restart: "no"
    env_file:
      - path: ./backend/.env
        required: false
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  storage-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "0:0"
    command:
      [
        "sh",
        "-c",
        "mkdir -p /var/lib/maap/uploads && chown -R 10001:10001 /var/lib/maap/uploads",
      ]
    restart: "no"
    volumes:
      - uploads:/var/lib/maap/uploads
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      <<: *api-environment
      MAAP_ADMIN_API_KEY: ${MAAP_ADMIN_API_KEY:?Set MAAP_ADMIN_API_KEY in .env.compose}
      MAAP_DEEPSEEK_API_KEY: ${MAAP_DEEPSEEK_API_KEY:?Set MAAP_DEEPSEEK_API_KEY in .env.compose}
      MAAP_JWT_SECRET_KEY: ${MAAP_JWT_SECRET_KEY:?Set MAAP_JWT_SECRET_KEY in .env.compose}
      MAAP_WIDGET_JWT_SECRET_KEY: ${MAAP_WIDGET_JWT_SECRET_KEY:?Set MAAP_WIDGET_JWT_SECRET_KEY in .env.compose}
    ports:
      - "127.0.0.1:${MAAP_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - uploads:/var/lib/maap/uploads
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - edge

  ingestion-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      [
        "python",
        "-m",
        "backend.app.workers.ingestion_worker",
      ]
    restart: unless-stopped
    init: true
    env_file:
      - path: ./backend/.env
        required: false
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - uploads:/var/lib/maap/uploads
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - edge

volumes:
  postgres_data:
  redis_data:
  uploads:

networks:
  backend:
    internal: true
  edge:
