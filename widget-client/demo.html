<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAAP Widget Client — Interactive Demo</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      padding: 2rem;
      max-width: 800px;
      margin: 0 auto;
      line-height: 1.6;
    }
    h1 { color: #4f46e5; }
    .card {
      background: #ffffff;
      padding: 1.5rem;
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 1.5rem;
    }
    .btn-group {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    button {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s;
    }
    button:hover { background: #4338ca; }
    button.secondary { background: #64748b; }
    button.secondary:hover { background: #475569; }
  </style>
</head>
<body>
  <h1>Modern AI Agent Platform — Widget Preview</h1>
  <p>This page previews the isolated Widget UI with the explicit local mock transport.</p>

  <div class="card">
    <h2>WidgetAPI Controls</h2>
    <p>Use the buttons below to interact programmatically with <code>window.WidgetAPI</code>:</p>
    <div class="btn-group">
      <button onclick="window.WidgetAPI?.open()">Open Widget</button>
      <button onclick="window.WidgetAPI?.close()" class="secondary">Close Widget</button>
      <button onclick="window.WidgetAPI?.setConfig({ direction: 'rtl', language: 'ar' })">Use RTL</button>
      <button onclick="window.WidgetAPI?.refresh()">Refresh Preview</button>
      <button onclick="window.WidgetAPI?.destroy()" class="secondary">Destroy Widget</button>
    </div>
  </div>

  <!-- Configure widget via window.WidgetConfig before script load -->
  <script>
    window.WidgetConfig = {
      transport: 'mock',
      launcherLabel: 'Chat with AI Support',
      mockScenario: 'happy-path',
      mock: {
        displayName: 'MAAP Assistant',
        welcomeMessage: 'Welcome to the MAAP AI Assistant demo! How can I help you today?',
        position: 'right'
      }
    };
  </script>

  <!-- Load Widget Bundle -->
  <script type="module" src="/src/index.ts"></script>
</body>
</html>
